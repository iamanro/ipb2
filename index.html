<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A local Intelligence Preparation of the Battlefield workbench: terrain effects, threat evaluation, and threat courses of action."
    />
    <title>IPB</title>
    <!-- Cascade layer order, declared before any stylesheet: a browser orders
         layers by first appearance, and the build may link a shared chunk's
         CSS (e.g. src/release.css, all "components") ahead of shell.css. -->
    <style>
      @layer reset, vendor, base, shell, components, responsive;
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <a class="brand" href="/">AGILE CUB</a>
        <nav class="module-nav" id="module-nav" aria-label="Modules"></nav>
        <div class="masthead-status" id="masthead-status"></div>
        <div class="user-chip" id="user-chip" hidden></div>
      </header>
      <main class="module-root" id="module-root"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
