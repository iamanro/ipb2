<div class="workspace">
  <nav class="tab-nav" id="tab-nav" aria-label="Exercise sections">
    <button class="tab-button" type="button" data-tab="requirements">Requirements</button>
    <button class="tab-button" type="button" data-tab="reports">Reports</button>
    <button class="tab-button" type="button" data-tab="rfi">RFI</button>
    <button class="tab-button" type="button" data-tab="scenario">Scenario</button>
    <button class="tab-button" type="button" data-tab="roster">Roster</button>
    <button class="tab-button" type="button" data-tab="activity">Activity</button>
  </nav>
  <main class="panel" id="panel"></main>
</div>

<dialog class="workspace-dialog" id="confirm-dialog">
  <form method="dialog">
    <p class="dialog-message" id="confirm-message"></p>
    <div class="dialog-actions">
      <button class="text-button" type="submit" value="cancel">Cancel</button>
      <button class="dialog-accept" type="submit" value="accept">Delete</button>
    </div>
  </form>
</dialog>
