name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Node 24 LTS, as in the Dockerfile: the server needs `node:sqlite`.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format, lint and typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # No reference data (terrain, equipment, geography) in CI: the e2e
      # tests run against an empty install, as a fresh clone does.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build and load locally; nothing is pushed or deployed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ipb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runtime image copies only the src/ files the server imports
      # (Dockerfile); a new one missing there fails here, not on the server.
      - name: Server starts in the image
        run: |
          docker run -d --name ipb-ci -e IPB_ADMIN_PASSWORD=ci-bootstrap-password ipb:ci
          for attempt in $(seq 1 30); do
            if docker exec ipb-ci node -e "fetch('http://127.0.0.1:8000/api/auth/me').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          docker logs ipb-ci
          exit 1
